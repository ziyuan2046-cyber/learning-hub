  const memory = new Map();
  let timer = null, controller = null, mounted = null, current = null, state = null;
  const reduce = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  const tokens = (count, fn) => Array.from({length:count}, (_,i) => fn(i)).join("");

  const dot = (x,y,id,color="mint",size=10) => `<g data-key="${id}"><circle cx="${x}" cy="${y}" r="${size}" class="ml-dot ${color}"/><circle cx="${x-3}" cy="${y-3}" r="2.4" fill="white" opacity=".55"/>${id.startsWith('apple')?`<path d="M${x} ${y-size+1}q-2-9 8-7q0 7-8 7" fill="#579b77"/>`:''}</g>`;

  function scene(lesson,n,action) {

      const dots=tokens(total,i=>{const orange=i>=3, pos=action?i:(orange?i-3:i), x=action?50+(pos%5)*55:(orange?199:43)+(pos%3)*36, y=action?100+Math.floor(pos/5)*48:90+Math.floor(pos/3)*40;return dot(x,y,`apple${i}`,orange?"orange":"mint",12)});
      return svg(bowls+dots+(action?text(160,222,`合起来 ${total} 个`):text(80,222,"原来 3 个")+text(240,222,`又来 ${n} 个`))+(!action?text(160,125,"＋","ml-big"):""),`原来3个苹果，又来${n}个，共${total}个`);
    }

      const dots=tokens(17,i=>{const g=Math.floor(i/n),j=i%n,left=action&&g>=groups;let x,y;if(!action){x=61+(i%5)*49;y=62+Math.floor(i/5)*35;}else if(left){x=74+(i-groups*n)*24;y=205;}else{x=26+(g%4)*77+(j%3)*17;y=39+Math.floor(g/4)*78+Math.floor(j/3)*23;}return dot(x,y,`sweet${i}`,left?"orange":"mint",7)});

    if(kind==="fraction") {

    }
    if(kind==="area") {
      const w=4*27,h=n*27,x=106,y=35;
      return svg(tokens(4*n,i=>`<rect x="${x+(i%4)*27}" y="${y+Math.floor(i/4)*27}" width="27" height="27" class="ml-cell"/>`)+`<rect x="${x}" y="${y}" width="${w}" height="${h}" class="ml-outline ${action?'walk':''}"/>`+text(160,22,"长 4 厘米")+text(46,y+h/2,`宽${n}厘米`)+text(160,226,action?`围一圈：${2*(4+n)}厘米`:`铺里面：${4*n}平方厘米`),`长4厘米宽${n}厘米，周长${2*(4+n)}厘米，面积${4*n}平方厘米`);
    }
    if(kind==="price") {
      return svg(tokens(n,i=>{const x=28+(i%5)*58,y=33+Math.floor(i/5)*82;return `<g data-key="book${i}"><rect x="${x}" y="${y}" width="44" height="64" rx="5" class="ml-fill ${i%2?'orange':'mint'}"/><path d="M${x+8} ${y}v64" stroke="white" opacity=".55"/>${text(x+26,y+36,"8元")}</g>`})+text(160,226,action?`结账：${8*n}元`:`${n}本笔记本，每本8元`),`${n}本笔记本，每本8元，共${8*n}元`);
    }
    if(kind==="average") {
      const levels=action?[n+2,n+2,n+2]:[2,4,n*3];
      return svg(tokens(3,i=>{const x=39+i*91,height=levels[i]*10;return `<rect x="${x}" y="38" width="58" height="145" rx="7" class="ml-glass"/><rect data-key="juice${i}" x="${x+5}" y="${178-height}" width="48" height="${height}" rx="4" class="ml-juice"/>${tokens(12,j=>`<path d="M${x+1} ${178-j*10}h7" stroke="#9bb8bd"/>`)}${text(x+29,207,`${levels[i]}份`)}`})+(action?`<path d="M28 ${178-(n+2)*10}H292" class="ml-dash"/>`:"")+text(160,235,action?"每杯一样多，总量不变":"总量不变，移多补少"),`三杯原来2、4、${n*3}份，平均后每杯${n+2}份`);
    }
    if(kind==="triangle") {
      const x=72,w=176,h=n*22,y=205;
      return svg((action?`<path d="M${x} ${y-h}H${x+w}V${y}Z" class="ml-fill orange ml-arrive"/>`:"")+`<path d="M${x} ${y}H${x+w}L${x} ${y-h}Z" class="ml-fill mint"/><path d="M${x} ${y}V${y-h}" class="ml-dash"/>`+text(160,229,"底 8 厘米")+text(41,y-h/2,`高 ${n}`,"ml-small")+text(160,18,action?"两个相同三角形 → 长方形":"一个三角形占多少？"),`底8厘米高${n}厘米的直角三角形，两个拼成面积${8*n}平方厘米的长方形`);
    }
    if(kind==="volume") {
      const body=[];
      for(let z=0;z<n;z++)for(let y=1;y>=0;y--)for(let x=0;x<3;x++){
        const px=124+(x-y)*25,py=184+(x+y)*12-z*25;
        body.push(`<g data-key="cube${x}-${y}-${z}" opacity="${action&&z<n-1?.24:1}"><path d="M${px} ${py}l25 12v-25l-25-12Z" fill="#80bcb0" stroke="#fff"/><path d="M${px+25} ${py+12}l25-12v-25l-25 12Z" fill="#4b948a" stroke="#fff"/><path d="M${px} ${py-25}l25-12 25 12-25 12Z" fill="#c7e7dc" stroke="#fff"/></g>`);

      return svg(body+(action?text(160,212,"长约 πr，宽约 r"):text(160,224,`半径 ${n} 厘米`))+(!action?`<path d="M160 120h${r}" class="ml-dash"/>`:"")+text(160,24,action?"分得越细，越接近长方形":"一个圆分成16个扇形"),`圆半径${n}厘米，分成16扇形，${action?'交错排列近似长方形':'原位组成圆'}，面积${n*n}π平方厘米`);
    }
    return svg(`<rect x="29" y="31" width="262" height="105" rx="15" class="ml-tray"/>`+text(160,56,"原价 200 元")+(action?tokens(10,i=>`<rect x="${34+i*25.2}" y="86" width="22.5" height="33" rx="3" class="ml-fill ${i<n?'mint':'pale'}"/>`):text(160,109,`现价 ${20*n} 元`,"ml-price"))+text(160,169,`${n}折 = ${n*10}%`)+text(160,211,action?`付${n}份 × 每份20元 = ${20*n}元`:`便宜了 ${200-20*n} 元`),`原价200元，${n}折，现价${20*n}元，便宜${200-20*n}元`);
  }

  function render(bookId) {
    const lesson=catalog.find(item=>item.id===bookId);
    return `<section class="ml-classroom" data-lesson="${lesson.id}" aria-labelledby="mlTitle">
      <div class="ml-heading"><div><p class="eyebrow">本册示范小课 · 看见数学</p><h3 id="mlTitle">${lesson.title}</h3></div><span class="ml-topic">${lesson.topic}</span></div>
      <div class="ml-route" aria-label="学习步骤"><button type="button" data-phase="0">01 看一看</button><button type="button" data-phase="1">02 动手试</button><button type="button" data-phase="2">03 说规律</button></div>
      <div class="ml-layout"><div class="ml-theater"><div class="ml-scene"></div><div class="ml-caption"><span class="ml-guide" aria-hidden="true">?</span><p></p></div></div>
      <div class="ml-workbench"><p class="ml-control-title">动一动，看看会发生什么</p><div class="ml-value-row"><label for="mlRange">${lesson.label}</label><output id="mlValue" for="mlRange"></output></div>
        <div class="ml-adjust"><button type="button" data-delta="-1" aria-label="减少数值">−</button><input id="mlRange" type="range" min="${lesson.min}" max="${lesson.max}" value="${lesson.value}"><button type="button" data-delta="1" aria-label="增加数值">＋</button></div>
        <button class="ml-action" type="button" data-action="transform">${lesson.action}</button>
        <div class="ml-player"><button type="button" data-action="play" aria-pressed="false">播放变化</button><button type="button" data-action="reset">重来一次</button></div>
        <div class="ml-predict"><p class="ml-question"></p><div class="ml-choices"></div><p class="ml-feedback" role="status"></p><button class="ml-retry" type="button" data-action="retry" hidden>再想一次</button></div>
      </div></div>
      <div class="ml-rule" hidden><span>原来是这样</span><strong class="ml-equation"></strong><p class="ml-explanation"></p><p class="ml-takeaway"></p></div>
      <button class="ml-reveal" type="button" data-action="reveal">看看数量关系 →</button><p class="ml-note">每册先用一个核心小实验帮助理解；更多主题可在知识地图里继续学习。</p>
    </section>`;
  }
  function stop() {
    if(timer)clearInterval(timer);
    timer=null;
    if(controller)controller.abort();
    controller=null;
    mounted=null;
  }
  function stopPlayback() {
    if(timer)clearInterval(timer);
    timer=null;
    const btn=mounted?.querySelector('[data-action="play"]');
    if(btn){btn.textContent="播放变化";btn.setAttribute("aria-pressed","false");}
  }
  function draw(animate=true) {
    if(!mounted||!current)return;
    const root=mounted,lesson=current,s=state;
    const canvas=root.querySelector('.ml-scene');
    const old=new Map([...canvas.querySelectorAll('[data-key]')].map(el=>[el.dataset.key,el.getBoundingClientRect()]));
    canvas.innerHTML=scene(lesson,s.n,s.action);
    if(animate&&!reduce()) {
      canvas.querySelectorAll('[data-key]').forEach(el=>{const previous=old.get(el.dataset.key),now=el.getBoundingClientRect();if(previous){const dx=previous.x-now.x,dy=previous.y-now.y;if(Math.abs(dx)+Math.abs(dy)>1)el.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'translate(0,0)'}],{duration:400,easing:'cubic-bezier(.2,.75,.2,1)'});}else el.animate([{opacity:0},{opacity:1}],{duration:280});});
    }
    root.querySelector('#mlRange').value=s.n;
    root.querySelector('#mlRange').setAttribute('aria-valuetext',lesson.display?lesson.display(s.n):`${s.n}${lesson.unit}`);
    root.querySelector('#mlValue').textContent=lesson.display?lesson.display(s.n):`${s.n}${lesson.unit}`;
    root.querySelector('.ml-caption p').textContent=s.phase===0?lesson.story:s.phase===1?'试着改变数值，再点绿色按钮。图中的数量怎样变化？数一数，猜一猜。':lesson.explain(s.n);
    root.querySelector('[data-action="transform"]').textContent=s.action?lesson.after:lesson.action;
    root.querySelector('[data-action="transform"]').setAttribute('aria-pressed',s.action);
    root.querySelector('[data-delta="-1"]').disabled=s.n===lesson.min;
    root.querySelector('[data-delta="1"]').disabled=s.n===lesson.max;
    root.querySelectorAll('[data-phase]').forEach(btn=>{const active=Number(btn.dataset.phase)===s.phase;btn.setAttribute('aria-pressed',active);});
    root.querySelector('.ml-rule').hidden=s.phase<2;
    root.querySelector('.ml-equation').textContent=lesson.formula(s.n);
    root.querySelector('.ml-explanation').textContent=lesson.explain(s.n);
    root.querySelector('.ml-takeaway').textContent=lesson.rule;
    root.querySelector('[data-action="reveal"]').hidden=s.phase===2;
    root.querySelector('.ml-question').textContent=`猜一猜：${lesson.question}`;
    const correct=lesson.answer(s.n);
    const offsets=[-1,0,1];
    const answers=[...new Set(offsets.map(d=>Math.max(0,correct+d)))];
    if(answers.length<3)answers.push(correct+2);
    root.querySelector('.ml-choices').innerHTML=answers.map(value=>`<button type="button" data-guess="${value}" ${s.guess!==null?'disabled':''} class="${s.guess!==null&&value===correct?'correct':s.guess===value?'wrong':''}">${value}</button>`).join('');
    root.querySelector('.ml-feedback').textContent=s.guess===null?'试着先判断，再打开关系式。':s.guess===correct?'答对了！再说一说你是怎么想的。':`这次是${correct}。看图数一数，或查看下面的数量关系。`;
    root.querySelector('[data-action="retry"]').hidden=s.guess===null||s.guess===correct;
  }
  function mount(root,bookId) {
    stop();
    mounted=root.querySelector('.ml-classroom');
    if(!mounted)return;
    current=catalog.find(item=>item.id===bookId);
    if(!memory.has(bookId))memory.set(bookId,{n:current.value,action:false,phase:0,guess:null});
    state=memory.get(bookId);
    controller=new AbortController();
    const signal=controller.signal;
    mounted.addEventListener('input',event=>{
      if(event.target.id!=='mlRange')return;
      stopPlayback();state.n=Number(event.target.value);state.phase=Math.max(1,state.phase);state.guess=null;draw();
    },{signal});
    mounted.addEventListener('click',event=>{
      const btn=event.target.closest('button');if(!btn)return;
      if(btn.dataset.delta){stopPlayback();state.n=Math.min(current.max,Math.max(current.min,state.n+Number(btn.dataset.delta)));state.guess=null;state.phase=Math.max(1,state.phase);draw();}
      else if(btn.hasAttribute('data-phase')){stopPlayback();state.phase=Number(btn.dataset.phase);if(state.phase===0)state.action=false;draw(false);}
      else if(btn.hasAttribute('data-guess')){stopPlayback();state.guess=Number(btn.dataset.guess);draw(false);}
      else if(btn.dataset.action==='retry'){state.guess=null;draw(false);}
      else if(btn.dataset.action==='transform'){stopPlayback();state.action=!state.action;state.phase=Math.max(1,state.phase);draw();}
      else if(btn.dataset.action==='reveal'){stopPlayback();state.phase=2;draw(false);}
      else if(btn.dataset.action==='reset'){stopPlayback();Object.assign(state,{n:current.value,action:false,phase:0,guess:null});draw();}
      else if(btn.dataset.action==='play'){
        if(timer){stopPlayback();return;}
        state.phase=1;state.action=true;state.guess=null;
        if(state.n>=current.max)state.n=current.min;
        draw();
        if(reduce()){state.n=current.max;state.phase=2;draw(false);return;}
        btn.textContent='暂停变化';btn.setAttribute('aria-pressed','true');
        timer=setInterval(()=>{if(state.n>=current.max){stopPlayback();state.phase=2;draw(false);return;}state.n++;draw();},1000);
      }
    },{signal});
    draw(false);
  }
  document.addEventListener('visibilitychange',()=>{if(document.hidden)stopPlayback();});
  window.MathLab={catalog,render,mount,stop,pause:stopPlayback};
})();

</script>
  <script data-inlined-source="math/assets/app.js">

  function syncUrl() {
    const url = new URL(location.href);
    url.searchParams.set("grade", state.grade);
    url.searchParams.set("term", state.term);
    url.searchParams.set("view", state.view);
    history.replaceState(null, "", url);
    try { localStorage.setItem("math-book", currentBook().id); } catch (_) { /* Storage may be disabled. */ }
  }

  function renderPicker() {
    $("#gradeChoices").innerHTML = data.grades.map((item) => `<button type="button" data-grade="${item.id}" aria-pressed="${item.id === state.grade}">${escape(item.name)}</button>`).join("");
    $("#termChoices").innerHTML = [["up", "上册"], ["down", "下册"]].map(([value, label]) =>
      `<button type="button" data-term="${value}" aria-pressed="${value === state.term}">${label}</button>`).join("");
  }

  function renderUnits(book) {
    return `<div class="content-heading"><div><p class="eyebrow">${book.units.length} 个知识主题</p><h3>本册学什么</h3></div></div>
      <button class="ml-invite" type="button" data-open-lab>先动手：${window.MathLab.catalog.find(item=>item.id===book.id).title} <span>去小课堂 →</span></button>
      <div class="learning-layout"><div class="unit-list">${book.units.map((unit) => `
        <details class="unit-row" id="unit-${unit.no}"><summary>
          <span class="unit-number">${unit.no}</span><span class="unit-copy"><strong>${escape(unit.title)}</strong><small>${escape(unit.brief)}</small></span>
          <span class="unit-arrow" aria-hidden="true">＋</span>
        </summary><div class="unit-detail"><ul>${unit.learn.map((point) => `<li>${escape(point)}</li>`).join("")}</ul>
          <p><b>记住</b> ${escape(unit.tip)}</p><a href="${bookUrl(book)}#unit-${unit.no}">在册页查看 →</a></div></details>`).join("")}</div>
        <aside class="first-step"><p class="eyebrow">试着记住这一条</p><h4>${escape(book.formulas[0].title)}</h4>
          <div class="first-formula">${escape(book.formulas[0].expr)}</div>
          ${book.id === "g1-up" ? '<img class="part-whole" src="./assets/part-whole.svg" alt="线段图：左边3份、右边2份，合起来是5份" width="360" height="130">' : ""}
          <p>${escape(book.formulas[0].explain)}</p>
          <a href="${bookUrl(book)}#formulas">查看本册全部公式 →</a></aside></div>`;
  }

  function renderFormulas(book) {
    return `<div class="content-heading"><div><p class="eyebrow">${book.formulas.length} 条核心公式</p><h3>公式与例子</h3></div></div>
      <div class="formula-list">${book.formulas.map((formula, index) => `<article class="formula-row" id="formula-${index + 1}">
        <span class="formula-index">${String(index + 1).padStart(2, "0")}</span><div><h4>${escape(formula.title)}</h4>
        <p class="formula-expression">${escape(formula.expr)}</p><p>${escape(formula.explain)}</p>
        <small>例如：${escape(formula.example)}</small></div></article>`).join("")}</div>`;
  }

  function renderMethods(book) {
    return `<div class="content-heading"><div><p class="eyebrow">${book.applications.length} 种应用题</p><h3>先想关系，再列算式</h3></div></div>
      <div class="solve-steps" aria-label="应用题解题步骤"><span><b>1</b> 圈出已知和问题</span><span><b>2</b> 画图或写数量关系</span><span><b>3</b> 分步列式计算</span><span><b>4</b> 检查结果与单位</span></div>
      <div class="method-list">${book.applications.map((method, index) => `<details class="method-item" id="method-${index + 1}" ${index === 0 ? "open" : ""}>
        <summary><span class="method-index">${String(index + 1).padStart(2, "0")}</span><span><strong>${escape(method.title)}</strong><small>${escape(method.kind)} · ${method.clues.map(escape).join(" / ")}</small></span><span class="expand-mark" aria-hidden="true">＋</span></summary>
        <div class="method-body"><ol>${method.steps.map((step) => `<li>${escape(step)}</li>`).join("")}</ol>
          <div class="worked-example"><p class="example-label">例题</p><p>${escape(method.example.question)}</p>
            <strong>${escape(method.example.work)}</strong><p class="answer">答：${escape(method.example.answer)}</p></div>
          <p class="reminder"><b>别忘记</b> ${escape(method.tip)}</p></div></details>`).join("")}</div>`;
  }

  function renderLab(book) {
    return window.MathLab.render(book.id);
  }
  function stopLabPlayback() { window.MathLab.stop(); }

  function renderQuiz(book) {
    return `<div class="content-heading"><div><p class="eyebrow">3 道小练习</p><h3>做一做</h3></div></div>
      <div class="quiz-list">${book.quiz.map((question, index) => `<fieldset class="quiz-question" data-question="${index}">
        <legend><span>${index + 1} / ${book.quiz.length}</span>${escape(question.question)}</legend>
        <div class="quiz-options">${question.options.map((option, choice) => `<button type="button" data-choice="${choice}">${escape(option)}</button>`).join("")}</div>
        <p class="quiz-feedback" aria-live="polite"></p></fieldset>`).join("")}</div>
      <div class="quiz-summary"><p id="quizProgress" aria-live="polite">已完成 0 / ${book.quiz.length} 题</p><button class="reset-quiz" id="resetQuiz" type="button">重新练习</button></div>`;
  }

  function render() {
    window.MathLab.stop();
    const book = currentBook();
    document.body.classList.toggle("view-lab", state.view === "lab");
    $$("[data-grade]").forEach((button) => button.setAttribute("aria-pressed", button.dataset.grade === String(state.grade)));
    $$("[data-term]").forEach((button) => button.setAttribute("aria-pressed", button.dataset.term === state.term));
    $$("#studyTabs button").forEach((button) => {
      button.classList.toggle("is-active", button.dataset.view === state.view);
      if (button.dataset.view === state.view) button.setAttribute("aria-current", "page");
      else button.removeAttribute("aria-current");
    });
    $("#editionLabel").textContent = book.edition;
    $("#bookMeta").textContent = `${gradeName(book.grade)} · ${book.term} · ${book.edition}`;
    $("#bookTitle").textContent = book.theme;
    $("#bookIntro").textContent = book.intro;
    $("#bookLink").href = bookUrl(book);
    $("#studyContent").innerHTML = ({ units: renderUnits, lab: renderLab, formulas: renderFormulas, methods: renderMethods, quiz: renderQuiz })[state.view](book);
    if (state.view === "lab") window.MathLab.mount($("#studyContent"), book.id);
    const rail = $("#gradeChoices");
    const selected = $("#gradeChoices [aria-pressed=true]");
    const railBox = rail.getBoundingClientRect();
    const selectedBox = selected.getBoundingClientRect();
    if (selectedBox.left < railBox.left + 4 || selectedBox.right > railBox.right - 4) {
      const delta = selectedBox.left - railBox.left - (rail.clientWidth - selected.clientWidth) / 2;
      rail.scrollBy({left: delta, behavior: "auto"});
    }
    syncUrl();
  }

  $("#gradeChoices").addEventListener("click", (event) => {
    const button = event.target.closest("button[data-grade]");
    if (!button || Number(button.dataset.grade) === state.grade) return;
    stopLabPlayback();
    state.grade = Number(button.dataset.grade); render(); $(`#gradeChoices [data-grade="${state.grade}"]`).focus();
  });
  $("#termChoices").addEventListener("click", (event) => {
    const button = event.target.closest("button[data-term]");
    if (!button || button.dataset.term === state.term) return;
    stopLabPlayback();
    state.term = button.dataset.term; render(); $(`#termChoices [data-term="${state.term}"]`).focus();
  });
  $("#studyTabs").addEventListener("click", (event) => {
    const button = event.target.closest("button[data-view]");
    if (!button || button.dataset.view === state.view) return;
    stopLabPlayback();
    state.view = button.dataset.view; render(); $(`#studyTabs [data-view="${state.view}"]`).focus();
    const content = $("#studyContent");
    const top = content.getBoundingClientRect().top + scrollY - $("#studyTabs").offsetHeight - $(".topbar").offsetHeight - 8;
    if (content.getBoundingClientRect().top < 130) {
      window.scrollTo({top, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
    }
  });
  $("#studyContent").addEventListener("click", (event) => {
    if(event.target.closest('[data-open-lab]')) {
      state.view="lab";render();$("#studyTabs [data-view=lab]").focus();return;
    }
    const button = event.target.closest("button[data-choice], #resetQuiz");
    if (!button || state.view !== "quiz") return;
    if (button.id === "resetQuiz") { render(); return; }
    const fieldset = button.closest("[data-question]");
    if (fieldset.dataset.answered) return;
    const question = currentBook().quiz[Number(fieldset.dataset.question)];
    const correct = Number(button.dataset.choice) === question.answer;
    fieldset.dataset.answered = correct ? "correct" : "wrong";
    $$("button", fieldset).forEach((option) => {
      option.disabled = true;
      if (Number(option.dataset.choice) === question.answer) option.classList.add("is-correct");
      else if (option === button) option.classList.add("is-wrong");
    });
    $(".quiz-feedback", fieldset).textContent = `${correct ? "答对了。" : `正确答案：${question.options[question.answer]}。`}${question.explain}`;
    const answered = $$("[data-question][data-answered]").length;
    const right = $$("[data-question][data-answered=correct]").length;
    $("#quizProgress").textContent = answered === currentBook().quiz.length ? `完成啦，答对 ${right} / ${answered} 题。` : `已完成 ${answered} / ${currentBook().quiz.length} 题`;
  });

  const searchDialog = $("#searchDialog");
  const searchInput = $("#searchInput");
  let searchTrigger = null;
  function searchResults(query) {
    const results = [];
    const term = query.trim().toLowerCase();
    if (!term) return results;
    books.forEach((book) => {
      const prefix = `${gradeName(book.grade)} · ${book.term}`;
      const lesson = window.MathLab.catalog.find(item=>item.id===book.id);
      const entries = [
        {title:lesson.title, terms:[lesson.title,lesson.topic,lesson.story], type:"互动实验", view:"lab", id:"mlTitle"},
        ...book.units.map((item) => ({ title: item.title, terms: [item.title, item.brief, ...item.learn, item.tip], type: "知识点", view: "units", id: `unit-${item.no}` })),
        ...book.formulas.map((item, index) => ({ title: item.title, terms: [item.title, item.expr, item.explain, item.example], type: "公式", view: "formulas", id: `formula-${index + 1}` })),
        ...book.applications.map((item, index) => ({ title: item.title, terms: [item.kind, item.title, ...item.clues, ...item.steps, item.example.question, item.example.work, item.tip], type: "应用题", view: "methods", id: `method-${index + 1}` }))
      ];
      entries.forEach((entry) => {
        if (entry.terms.join(" ").toLowerCase().includes(term)) results.push({ ...entry, prefix, bookId: book.id });
      });
    });
    return results.sort((a, b) =>
      Number(b.bookId === currentBook().id) - Number(a.bookId === currentBook().id)
      || Number(b.title.includes(term)) - Number(a.title.includes(term))
    );
  }
  function renderSearch() {
    const term = searchInput.value.trim();
    const target = $("#searchResults");
    if (!term) {
      target.innerHTML = '<div class="search-empty">试试搜索「面积」「平均数」或「折扣」。</div>';
      return;
    }
    const results = searchResults(term);
    target.innerHTML = results.length ? results.slice(0, 30).map((result) => `
      <button type="button" data-book="${result.bookId}" data-view="${result.view}" data-target="${result.id}">
        <span><strong>${escape(result.title)}</strong><small>${escape(result.prefix)} · ${escape(result.type)}</small></span>
        <span class="search-arrow" aria-hidden="true">→</span></button>`).join("") :
      `<div class="search-empty">没有找到「${escape(term)}」。试试缩短关键词，或按年级浏览。</div>`;
  }
  ["#searchOpen", "#searchOpenInline"].forEach((selector) => {
    $(selector).addEventListener("click", (event) => {
      searchTrigger = event.currentTarget;
      window.MathLab.pause();
      searchDialog.showModal();
      searchInput.focus();
      renderSearch();
    });
  });
  $("#searchClose").addEventListener("click", () => searchDialog.close());
  searchDialog.addEventListener("click", (event) => { if (event.target === searchDialog) searchDialog.close(); });
  searchDialog.addEventListener("close", () => { if (searchTrigger) searchTrigger.focus(); });
  searchInput.addEventListener("input", renderSearch);
  $("#searchResults").addEventListener("click", (event) => {
    const result = event.target.closest("button[data-book]");
    if (!result) return;
    stopLabPlayback();
    const book = books.find((item) => item.id === result.dataset.book);
    state.grade = book.grade;
    state.term = book.term === "上册" ? "up" : "down";
    state.view = result.dataset.view;
    searchTrigger = null;
    searchDialog.close();
    render();
    const target = document.getElementById(result.dataset.target);
    if (!target) return;
    if (target.matches("details")) target.open = true;
    target.classList.add("search-highlight");
    const focusTarget = target.querySelector("summary") || target;
    if (!focusTarget.hasAttribute("tabindex") && focusTarget === target) focusTarget.tabIndex = -1;
    focusTarget.focus({preventScroll: true});
    window.scrollTo({top: target.getBoundingClientRect().top + scrollY - 145, behavior: "smooth"});
    setTimeout(() => target.classList.remove("search-highlight"), 2000);
  });

  renderPicker();
  $("#sourceNote").textContent = data.sourceNote;
  $("#updatedDate").textContent = data.updated;
  $("#updatedDate").dateTime = data.updated;
  render();
})();

</script>
