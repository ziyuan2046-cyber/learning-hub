<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071018"><title>学习空间 · 更新修复课程</title><style>
:root{color-scheme:dark;background:#071018;color:#edf9fa;font-family:"PingFang SC","Microsoft YaHei",sans-serif}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}main{max-width:680px;margin:auto;padding:calc(20px + env(safe-area-inset-top)) 18px calc(32px + env(safe-area-inset-bottom))}a{color:#83e2d8;text-decoration:none}.back{display:inline-flex;align-items:center;min-height:44px}h1{font-size:30px;line-height:1.4;margin:20px 0 12px}h2{font-size:20px;margin:0 0 12px}p,li{font-size:16px;line-height:1.9;color:#bad1d7}.box{padding:22px;border:1px solid #2b4b56;border-radius:20px;background:#10232d;margin:20px 0}.action{display:block;min-height:52px;width:100%;border:1px solid #437b80;border-radius:12px;padding:12px 16px;font-family:inherit;font-size:17px;font-weight:700;line-height:1.6;text-align:center;background:#61e6da;color:#071018;cursor:pointer;margin-top:14px}.action.secondary{background:#19323e;color:#dcf3f5}.action:disabled{opacity:.65;cursor:wait}.action:focus-visible,a:focus-visible{outline:3px solid #91fff0;outline-offset:4px}.status{color:#8ee5d7;min-height:30px}.log{padding:0;list-style:none;margin:12px 0}.log li{font-size:14px;line-height:1.8;margin:6px 0}.note{font-size:14px;color:#9cbcc5}.links{display:grid;grid-template-columns:1fr 1fr;gap:10px}.links a{padding:13px;border:1px solid #315864;border-radius:10px;color:#e3f5f8;text-align:center}.version{font-size:12px;color:#8fabb5}.error{color:#ffb49d}</style></head><body><main><a class="back" href="./">← 返回学习空间</a><h1>更新并恢复课程</h1><p>用于旧页面不更新、点进课程后空白或只有标题时。请保持联网，点击一次即可。</p><section class="box"><h2>保留学习记录</h2><p>只更新这些学习应用的网页缓存。<b>不清除收藏、学习进度或浏览器网站数据。</b>旧的离线课件可能需要重新下载。</p><button id="repair" class="action" type="button">更新并恢复全部课程</button><p id="status" class="status" role="status" aria-live="polite">尚未开始</p><ul id="log" class="log" aria-live="polite"></ul><a class="action secondary" id="open" href="./?release=20261106-recovery3" hidden>打开更新后的学习空间</a></section><section class="box"><h2>课程直达</h2><div class="links"><a href="./chinese/index.html?release=20261106-recovery3">汉字笔顺</a><a href="./chinese/guoxue/index.html?release=20261106-recovery3">课本国学</a><a href="../english-grade1/index.html?release=20261106-recovery3">课本英语</a><a href="./xiaoyuan/index.html?release=20261106-recovery3">森林英语</a><a href="./math/index.html?release=20261106-recovery3">小学数学</a><a href="./?release=20261106-recovery3">学习空间</a></div></section><p class="note">请在创建原桌面图标时使用的同一个浏览器中更新。微信内置浏览器与 Chrome 的数据不一定共用。若仍打不开，请把屏幕上的报错截图发来，不要先卸载应用或清除数据。</p><p class="version">修复版本：20261106-recovery3</p></main><script>
(function(){'use strict';
var VERSION='20261106-recovery3',button=document.getElementById('repair'),status=document.getElementById('status'),list=document.getElementById('log'),open=document.getElementById('open');
var scopes=[['学习空间','/learning-hub/sw.js'],['国学','/learning-hub/chinese/guoxue/sw.js'],['森林英语','/learning-hub/xiaoyuan/sw.js'],['课本英语','/english-grade1/sw.js']];
var courses=[['首页','/learning-hub/index.html'],['汉字笔顺','/learning-hub/chinese/index.html'],['课本国学','/learning-hub/chinese/guoxue/index.html'],['课本英语','/english-grade1/index.html'],['森林英语','/learning-hub/xiaoyuan/index.html'],['小学数学','/learning-hub/math/index.html']];
function log(t,error){var li=document.createElement('li');li.textContent=t;if(error)li.className='error';list.appendChild(li);}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
async function latest(url){var ctl=new AbortController(),timer=setTimeout(function(){ctl.abort();},60000);try{var u=new URL(url,location.origin);u.searchParams.set('repair',VERSION);u.searchParams.set('t',Date.now());var r=await fetch(u.href,{cache:'no-store',signal:ctl.signal});if(!r.ok)throw Error('HTTP '+r.status);return await r.text();}finally{clearTimeout(timer);}}
async function worker(item){var reg=await navigator.serviceWorker.register(item[1],{updateViaCache:'none'});await reg.update();var w=reg.installing||reg.waiting;if(w&&w.state!=='activated'){await new Promise(function(resolve,reject){var timer=setTimeout(function(){reject(Error('缓存更新超时'));},30000);function check(){if(w.state==='activated'){clearTimeout(timer);resolve();}if(w.state==='redundant'){clearTimeout(timer);reject(Error('缓存更新失败'));}}w.addEventListener('statechange',check);check();});}log('✓ '+item[0]+'更新程序已就绪');}
button.addEventListener('click',async function(){button.disabled=true;list.textContent='';open.hidden=true;status.textContent='检查线上修复版本…';try{
 var info=JSON.parse(await latest('/learning-hub/release.json'));if(info.version!==VERSION)throw Error('线上版本正在发布，请稍后再试');log('✓ 已连接修复版本 '+info.version);
 if('serviceWorker'in navigator){status.textContent='更新缓存程序…';var results=await Promise.allSettled(scopes.map(worker));results.forEach(function(r,i){if(r.status==='rejected')log('提示：'+scopes[i][0]+'缓存暂未更新：'+r.reason.message,true);});}
 status.textContent='下载并核验课程页面，请保持此页打开…';var failed=[];
 // Two at a time avoids saturating slower mobile connections.
 for(var i=0;i<courses.length;i+=2){await Promise.all(courses.slice(i,i+2).map(async function(c){try{var html=await latest(c[1]);if(html.indexOf('name="study-release" content="'+VERSION+'"')<0)throw Error('仍收到旧页面，请稍后重试');log('✓ '+c[0]+'内容已下载并核验');}catch(e){failed.push(c[0]);log('未完成：'+c[0]+'（'+e.message+'）',true);}}));}
 if(failed.length){status.textContent='部分课程未更新：'+failed.join('、')+'。可重试，学习记录未改变。';button.textContent='重新检查未完成的更新';}else{status.textContent='全部课程页面已更新。请点下面按钮重新打开。';button.textContent='再次检查更新';open.hidden=false;}
 }catch(e){status.textContent='更新未完成：'+e.message+'。请确认联网后重试；没有清除学习记录。';log('需要重新检查网络或发布版本',true);}finally{button.disabled=false;}
});})();</script></body></html>
